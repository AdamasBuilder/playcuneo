<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1520">
<title>Valuta la casa — play cuneo</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0a1520;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;}
  #urlfb{display:none;position:fixed;left:0;right:0;bottom:0;padding:12px 16px;background:#0f2231;
    color:#cfe8f5;font:13px/1.4 monospace;text-align:center;border-top:1px solid #3f7fa6;z-index:9;word-break:break-all;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="urlfb"></div>
<script src="../../motore.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   VALUTA LA CASA — l'unica cosa che cambia da gioco a gioco.
   Motore in ../../motore.js · meccanica "sort" in un modulo qui sotto.
   ═══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

var CFG = {
  destUrl    : 'https://wa.me/393389855696?text=Ciao%21%20Ho%20giocato%20VALUTA%20LA%20CASA%20di%20play%20cuneo%20e%20vorrei%20la%20versione%20per%20la%20mia%20agenzia',
  brand      : 'CASA DEMO LANGHE',
  title      : 'VALUTA LA CASA',
  tagline    : 'Quanto sai leggere una casa',
  howto      : 'Spingi ogni carta nel cesto giusto.',
  ctaLabel   : 'SCRIVIMI ORA',
  endMessage : 'Apri una porta e il resto lo vede chi lo sa guardare. Questa casa la leggi gia bene.',
  roundSec   : 20,
  landingUrl : '',
  watermark  : 'novanxion \u00b7 lo vuoi anche tu?',
  palette    : { bg1:'#0e2233', bg2:'#0a1520', bg3:'#0c1a26',
                 accent1:'#2f7fa6', accent2:'#4fa3c7', good:'#9fe8c4', bad:'#f0b49a' }
};

var CARDS = [
  { t:'Rifiniture rifatte',         good:true  },
  { t:'Umidita in taverna',         good:false },
  { t:'Esposizione a sud',          good:true  },
  { t:'Senza ascensore, 4 piano',   good:false },
  { t:'Classe energetica alta',     good:true  },
  { t:'Tetto da rifare',            good:false },
  { t:'Vista sulle colline',        good:true  },
  { t:'Vicino alla ferrovia',       good:false },
  { t:'Cortile privato',            good:true  },
  { t:'Impianto elettrico vecchio', good:false }
];
var TARGET = 9;

/* ───────── meccanica "sort": carta che scende, due cesti ───────── */
var mech = (function(){
  var stack = [], cur = null, cardY = 0, revealed = null, correct = 0, wrong = 0;
  var BIN = { w:0, h:0, y:0, lx:0, rx:0 };

  function layout(W, H){
    var pad = Math.max(10, W*0.035), gap = Math.max(8, W*0.03);
    BIN.w = (W - pad*2 - gap)/2;
    BIN.h = Math.min(H*0.16, 110);
    BIN.y = H - BIN.h - Math.max(28, H*0.032);
    BIN.lx = pad; BIN.rx = pad + BIN.w + gap;
  }
  function binRect(side){ return { x: side==='bad'?BIN.lx:BIN.rx, y:BIN.y, w:BIN.w, h:BIN.h }; }

  function resolve(api, sideIsGood){
    if (!cur) return;
    var ok = (sideIsGood === cur.good), wasGood = cur.good;
    if (ok){ correct++; api.addScore(100); api.sfx('hit'); }
    else   { wrong++;   api.addScore(-25); api.shake(6); api.sfx('miss'); }
    api.setProgress(correct + wrong, TARGET);
    revealed = { good: wasGood, ok: ok, t: 0.45 };
    cur = null;
    setTimeout(function(){
      if (api.state !== 'PLAY') return;
      revealed = null;
      if (correct + wrong >= TARGET) { api.end('done'); return; }
      next(api);
    }, 460);
  }
  function next(api){
    if (!stack.length) { api.end('done'); return; }
    cur = stack.shift();
    cardY = api.H*0.34;
  }

  return {
    init: function(api){
      stack = CARDS.slice(0);
      for (var i=stack.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=stack[i]; stack[i]=stack[j]; stack[j]=t; }
      correct = 0; wrong = 0; revealed = null; cur = null;
      next(api);
    },
    update: function(api, dt){
      var P = CFG.palette;
      if (revealed) revealed.t = Math.max(0, revealed.t - dt);
      if (cur){
        layout(api.W, api.H);
        var ramp = 1 + api.roundT / CFG.roundSec;
        cardY += (13 + 9*ramp) * dt;
        var maxY = BIN.y - 62;
        if (cardY > maxY) cardY = maxY;
        if (cardY < api.H*0.30) cardY = api.H*0.30;
      }
    },
    tap: function(api, x, y){
      layout(api.W, api.H);
      if (!cur) return;
      if (x>=BIN.lx && x<=BIN.lx+BIN.w && y>=BIN.y && y<=BIN.y+BIN.h) resolve(api, false);
      else if (x>=BIN.rx && x<=BIN.rx+BIN.w && y>=BIN.y && y<=BIN.y+BIN.h) resolve(api, true);
    },
    drag: function(api, x){
      if (!cur) return;
      if (x < api.W*0.34) resolve(api, false);
      else if (x > api.W*0.66) resolve(api, true);
    },
    draw: function(api, t){
      layout(api.W, api.H);
      var ctx = api.ctx, P = CFG.palette;
      /* cesti */
      [['bad','PROBLEMA'],['good','HA VALORE']].forEach(function(pair){
        var b = binRect(pair[0]), good = pair[0]==='good';
        var c1 = good ? 'rgba(127,227,176,' : 'rgba(224,138,106,';
        ctx.fillStyle = c1 + '0.14)'; api.rr(b.x,b.y,b.w,b.h,18); ctx.fill();
        ctx.strokeStyle = c1 + '0.8)'; ctx.lineWidth = 2.5; api.rr(b.x,b.y,b.w,b.h,18); ctx.stroke();
        ctx.fillStyle = good ? P.good : P.bad;
        api.setFont('800', api.fitSize(pair[1],'800',15,b.w-20));
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(pair[1], b.x+b.w/2, b.y+b.h/2+1);
      });
      /* carta */
      if (cur){
        var cw = Math.min(api.W*0.82, 330), chh = Math.min(96, api.H*0.13);
        var x = api.W/2-cw/2, y = cardY-chh/2;
        ctx.fillStyle='rgba(0,0,0,0.30)'; api.rr(x+3,y+5,cw,chh,18); ctx.fill();
        var g = ctx.createLinearGradient(x,y,x,y+chh);
        g.addColorStop(0,'#183245'); g.addColorStop(1,'#122636');
        ctx.fillStyle=g; api.rr(x,y,cw,chh,18); ctx.fill();
        ctx.strokeStyle='rgba(160,210,235,0.45)'; ctx.lineWidth=2.5; api.rr(x,y,cw,chh,18); ctx.stroke();
        api.setFont('700', api.fitSize(cur.t,'700',19,cw-34));
        ctx.fillStyle='#eaf6ff'; ctx.textAlign='center'; ctx.textBaseline='middle';
        var lines = api.wrapLines(cur.t, cw-30);
        var sy = y + chh/2 - (lines.length-1)*11;
        for (var i=0;i<lines.length;i++) ctx.fillText(lines[i], api.W/2, sy + i*23);
      }
      if (revealed){
        ctx.textAlign='center'; ctx.textBaseline='middle'; api.setFont('800', 15);
        ctx.fillStyle = revealed.ok ? P.good : P.bad;
        ctx.fillText(revealed.ok ? 'GIUSTO' : (revealed.good ? 'ERA VALORE' : 'ERA UN PROBLEMA'),
                     api.W/2, Math.max(90, cardY - 60));
      }
    },
    boxes: function(api){
      layout(api.W, api.H);
      return cur ? [binRect('good'), binRect('bad')] : [];
    },
    hud: function(){ return { left: 'CASE ' + (correct+wrong) + '/' + TARGET }; },
    result: function(api){
      return {
        verdict: (correct+wrong >= TARGET) ? 'CASA LETTA' : 'TEMPO SCADUTO',
        big: String(api.score),
        sub: 'PUNTI \u00b7 ' + correct + '/' + TARGET + ' CASE LETTE GIUSTE'
      };
    }
  };
})();

PlayCuneo.create({ cfg: CFG, mech: mech });
})();
</script>
</body>
</html>
