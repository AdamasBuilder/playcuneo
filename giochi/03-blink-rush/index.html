<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Blink Rush — Granda Connect (Playable Demo)</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0722;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;}
  #urlfb{display:none;position:fixed;left:0;right:0;bottom:0;padding:14px 16px;background:#120b2e;
    color:#ffd7ec;font:14px/1.4 monospace;text-align:center;border-top:1px solid #ff4f9a;z-index:9;
    word-break:break-all;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="urlfb"></div>
  <a id="back" href="../../index.html" style="position:fixed;right:10px;bottom:10px;z-index:8;display:none;font:600 11px/1 -apple-system,Segoe UI,Roboto,sans-serif;color:rgba(255,255,255,.6);text-decoration:none;background:rgba(0,0,0,.42);padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.16)">← play cuneo</a>
<script>
(function(){
'use strict';

/* =====================================================================
   ⚙️  CONFIGURAZIONE — MODIFICA QUI
   destUrl  : link di destinazione del CTA (sito, landing page o store)
   brand    : nome mostrato su intro, HUD ed end card
   ===================================================================== */
var CFG = {
  destUrl      : 'https://wa.me/393389855696?text=Ciao%21%20Ho%20giocato%20BLINK%20RUSH%20su%20play%20cuneo%20e%20vorrei%20il%20mio%20gioco%20pubblicitario',  // ← CTA demo: WhatsApp di play cuneo (per un cliente: il suo link)
  brand        : 'GRANDA CONNECT',
  tagline      : 'Eventi e persone nella provincia di Cuneo',
  ctaLabel     : 'VUOI IL TUO? SCRIVIMI',
  endMessage   : 'Con un occhiolino anonimo, la Blink Mode trova l\'evento giusto e il posto dove incontrarsi.',
  roundSeconds : 30,
  lives        : 3,
  speed        : 'normale',   // 'lenta' | 'normale' | 'veloce'
  allowSpeedPick : true       // false = velocità fissa, niente selettore
};
var SPEEDS = { lenta:0.72, normale:1, veloce:1.45 };

/* ---------------- stato globale ---------------- */
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;
var STATE = 'INTRO';           // INTRO | PLAY | END
var score = 0, lives = CFG.lives, timeLeft = CFG.roundSeconds;
var player = { x:0, y:0, w:86, h:54, tx:0 };
var items = [], parts = [], floaters = [];
var spawnWink = 0, spawnStar = 0, spawnBad = 0;
var lastT = 0, roundT = 0;
var started = 0;               // ms dall'inizio del round (per l'hint)
var lastInput = 0;
var shake = 0, flashT = 0;
var endReason = '';
var bestScore = 0;
var pickedSpeed = CFG.speed, speedMul = SPEEDS[CFG.speed] || 1;
var speedBtns = [], ctaBox = null, replayBox = null;

/* ---------------- audio (sintesi, zero file) ---------------- */
var AC = null, muted = false;
function audio(){
  if (muted) return null;
  try {
    if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    return AC;
  } catch(e){ return null; }
}
function beep(freq, dur, type, vol, when){
  var ac = audio(); if (!ac) return;
  var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + (when||0);
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfx(name){
  if (name==='catch'){ beep(660,0.09,'triangle',0.16,0); beep(880,0.12,'triangle',0.14,0.07); }
  else if (name==='star'){ beep(740,0.08,'sine',0.15,0); beep(988,0.10,'sine',0.15,0.06); beep(1318,0.14,'sine',0.13,0.12); }
  else if (name==='bad'){ beep(160,0.22,'sawtooth',0.16,0); beep(110,0.28,'sawtooth',0.12,0.05); }
  else if (name==='miss'){ beep(300,0.16,'square',0.10,0); beep(210,0.20,'square',0.09,0.08); }
  else if (name==='start'){ beep(520,0.08,'triangle',0.14,0); beep(780,0.12,'triangle',0.14,0.09); }
  else if (name==='tick'){ beep(560,0.05,'square',0.07,0); }
  else if (name==='end'){ beep(523,0.14,'triangle',0.15,0); beep(659,0.14,'triangle',0.15,0.13); beep(784,0.28,'triangle',0.15,0.26); }
}

/* ---------------- util ---------------- */
function rand(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  player.x = player.tx = W/2; player.y = H*0.84;
}
window.addEventListener('resize', resize);
resize();

/* ---------------- CTA / bridge di rete ---------------- */
function openDest(){
  var url = CFG.destUrl;
  try {
    if (window.mraid && typeof window.mraid.open === 'function'){ window.mraid.open(url); return; }
  } catch(e){}
  try {
    if (typeof window.clickTag !== 'undefined' && window.clickTag){ window.open(window.clickTag,'_blank'); return; }
  } catch(e){}
  var ok = false;
  try { ok = window.open(url,'_blank'); } catch(e){ ok = null; }
  if (ok) return;
  // iframe/preview senza pop-up: mostra l'URL a schermo
  var fb = document.getElementById('urlfb');
  fb.textContent = 'Destinazione CTA: ' + url;
  fb.style.display = 'block';
}

/* ---------------- input ---------------- */
var pointerDown = false;
function onDown(x,y){
  audio();                                  // sblocca l'audio al primo gesto
  lastInput = performance.now();
  if (STATE==='INTRO'){
    for (var i=0;i<speedBtns.length;i++){
      var b = speedBtns[i];
      if (x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h){
        pickedSpeed = b.k; speedMul = SPEEDS[b.k] || 1; sfx('tick'); return;
      }
    }
    startRound(); return;
  }
  if (STATE==='END'){
    if (replayBox && x>=replayBox.x && x<=replayBox.x+replayBox.w &&
        y>=replayBox.y && y<=replayBox.y+replayBox.h){ startRound(); return; }
    openDest(); return;
  }
  pointerDown = true; player.tx = x;
}
function onMove(x,y){
  if (!pointerDown || STATE!=='PLAY') return;
  player.tx = x; lastInput = performance.now();
}
function onUp(){ pointerDown = false; }
canvas.addEventListener('pointerdown', function(e){ e.preventDefault(); onDown(e.clientX,e.clientY); });
canvas.addEventListener('pointermove', function(e){ e.preventDefault(); onMove(e.clientX,e.clientY); });
window.addEventListener('pointerup', function(){ onUp(); });
window.addEventListener('pointercancel', function(){ onUp(); });
canvas.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

/* ---------------- game flow ---------------- */
function startRound(){
  STATE='PLAY'; score=0; lives=CFG.lives; timeLeft=CFG.roundSeconds;
  items=[]; parts=[]; floaters=[];
  spawnWink=spawnStar=spawnBad=0;
  roundT=0; started=performance.now(); shake=0; flashT=0;
  speedMul = SPEEDS[pickedSpeed] || 1;
  player.x = player.tx = W/2;
  sfx('start');
}
function endRound(reason){
  if (STATE!=='PLAY') return;
  STATE='END'; endReason = reason;
  shake = 0; flashT = 0;
  bestScore = Math.max(bestScore, score);
  sfx('end');
}
function addFloat(txt,x,y,color){ floaters.push({t:txt,x:x,y:y,c:color||'#fff',a:1}); }
function burst(x,y,color,n){
  for (var i=0;i<(n||10);i++){
    parts.push({x:x,y:y,vx:rand(-140,140),vy:rand(-220,-40),a:1,c:color,r:rand(2,5)});
  }
}

/* ---------------- spawn ---------------- */
function spawn(dt){
  var ramp = (1 + roundT/24) * speedMul;    // difficoltà crescente × velocità scelta
  spawnWink -= dt;
  if (spawnWink<=0){
    spawnWink = rand(0.55,0.85)/ramp;
    items.push({type:'wink', x:rand(40,W-40), y:-30, vy:rand(150,210)*ramp, r:22, ph:rand(0,6)});
  }
  spawnBad -= dt;
  if (spawnBad<=0){
    spawnBad = rand(1.7,2.6)/ramp;
    items.push({type:'bad', x:rand(40,W-40), y:-30, vy:rand(160,220)*ramp, r:21, ph:rand(0,6)});
  }
  spawnStar -= dt;
  if (spawnStar<=0){
    spawnStar = rand(4.2,6.5);
    items.push({type:'star', x:rand(40,W-40), y:-30, vy:rand(170,230)*ramp, r:20, ph:rand(0,6)});
  }
}

/* ---------------- update ---------------- */
function update(dt){
  if (STATE!=='PLAY') return;
  roundT += dt; timeLeft = CFG.roundSeconds - roundT;
  if (timeLeft<=0){ timeLeft=0; endRound('time'); return; }

  player.x += (player.tx - player.x) * Math.min(1, dt*14);
  player.x = clamp(player.x, player.w/2+8, W-player.w/2-8);

  spawn(dt);

  var py = player.y, px = player.x;
  for (var i=items.length-1;i>=0;i--){
    var it = items[i];
    it.y += it.vy*dt; it.ph += dt*6;
    var dx = Math.abs(it.x - px), dy = it.y - py;
    if (dx < player.w/2 + it.r*0.6 && dy > -player.h*0.8 && dy < player.h*0.5){
      // preso!
      if (it.type==='wink'){ score+=10; addFloat('+10',it.x,it.y,'#ff6fb1'); burst(it.x,it.y,'#ff6fb1',9); sfx('catch'); }
      else if (it.type==='star'){ score+=25; addFloat('+25',it.x,it.y,'#ffd34d'); burst(it.x,it.y,'#ffd34d',14); sfx('star'); }
      else { lives--; shake=10; flashT=0.25; addFloat('-1',it.x,it.y,'#9aa0b5'); burst(it.x,it.y,'#8890a8',8); sfx('bad'); }
      items.splice(i,1);
      if (lives<=0){ lives=0; endRound('lives'); return; }
      continue;
    }
    if (it.y - it.r > H){
      if (it.type==='wink'){ lives--; shake=7; addFloat('mancato!',it.x,H-70,'#ffb36b'); sfx('miss'); }
      items.splice(i,1);
      if (lives<=0){ lives=0; endRound('lives'); return; }
    }
  }

  for (var p=parts.length-1;p>=0;p--){
    var q = parts[p];
    q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 600*dt; q.a -= dt*1.6;
    if (q.a<=0) parts.splice(p,1);
  }
  for (var f=floaters.length-1;f>=0;f--){
    var fl = floaters[f]; fl.y -= 55*dt; fl.a -= dt*1.1;
    if (fl.a<=0) floaters.splice(f,1);
  }
}

/* ---------------- drawing: items ---------------- */
function drawWink(x,y,r,ph){
  var blink = 0.75 + 0.25*Math.sin(ph);           // occhio che ammicca
  var g = ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.2,x,y,r);
  g.addColorStop(0,'#ff9ecb'); g.addColorStop(1,'#ff3f92');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2.4; ctx.lineCap='round';
  // occhio aperto
  ctx.beginPath(); ctx.ellipse(x-r*0.34,y-r*0.14,r*0.14,r*0.16*blink,0,0,7); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-r*0.34,y-r*0.14,r*0.06,0,7); ctx.fill();
  // occhio ammiccante (linea)
  ctx.beginPath(); ctx.moveTo(x+r*0.16,y-r*0.14); ctx.lineTo(x+r*0.5,y-r*0.14); ctx.stroke();
  // sorriso
  ctx.beginPath(); ctx.arc(x,y+r*0.12,r*0.4,0.25,Math.PI-0.25); ctx.stroke();
}
function drawStar(x,y,r,ph){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ph*0.6);
  ctx.fillStyle='#ffd34d'; ctx.strokeStyle='#c99500'; ctx.lineWidth=1.5;
  ctx.beginPath();
  for (var i=0;i<10;i++){
    var a = -Math.PI/2 + i*Math.PI/5, rad = (i%2===0)? r : r*0.45;
    var px = Math.cos(a)*rad, py = Math.sin(a)*rad;
    if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawBad(x,y,r,ph){
  ctx.fillStyle='#5b6070'; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  ctx.strokeStyle='#d7dbe6'; ctx.lineWidth=3; ctx.lineCap='round';
  var s = r*0.32;
  ctx.beginPath(); ctx.moveTo(x-s,y-s); ctx.lineTo(x+s,y+s);
  ctx.moveTo(x+s,y-s); ctx.lineTo(x-s,y+s); ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y+r*0.5,r*0.35,Math.PI+0.4,-0.4); ctx.stroke(); // bocca storta
}
function drawPlayer(){
  var x = player.x, y = player.y, w = player.w, h = player.h;
  ctx.save();
  ctx.translate(x,y);
  // ombra
  ctx.fillStyle='rgba(0,0,0,0.35)'; rr(-w/2+4,-h/2+8,w,h,14); ctx.fill();
  // telefono
  var g = ctx.createLinearGradient(0,-h/2,0,h/2);
  g.addColorStop(0,'#1d2b5c'); g.addColorStop(1,'#121b3d');
  ctx.fillStyle=g; rr(-w/2,-h/2,w,h,14); ctx.fill();
  ctx.strokeStyle='#4d6bff'; ctx.lineWidth=2.5; rr(-w/2,-h/2,w,h,14); ctx.stroke();
  // schermo con faccina che ammicca
  ctx.fillStyle='#0b1130'; rr(-w/2+7,-h/2+8,w-14,h-16,7); ctx.fill();
  ctx.strokeStyle='#ff6fb1'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath(); ctx.ellipse(-11,-4,4,5,0,0,7); ctx.stroke();      // occhio
  ctx.beginPath(); ctx.moveTo(6,-4); ctx.lineTo(17,-4); ctx.stroke(); // ammiccamento
  ctx.beginPath(); ctx.arc(2,6,7,0.3,Math.PI-0.3); ctx.stroke();      // sorriso
  ctx.restore();
}

/* ---------------- drawing: HUD / screens ---------------- */
function bg(t){
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#140b34'); g.addColorStop(0.55,'#0d0826'); g.addColorStop(1,'#1a0f3e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // stelle/pulviscolo
  ctx.fillStyle='rgba(255,255,255,0.35)';
  for (var i=0;i<24;i++){
    var sx = ((i*97)%W + Math.sin(t*0.0004+i)*10 + W)%W;
    var sy = ((i*61)%(H*0.7));
    var sr = (i%3===0)?1.6:0.9;
    ctx.globalAlpha = 0.2 + 0.3*Math.abs(Math.sin(t*0.001+i));
    ctx.beginPath(); ctx.arc(sx,sy,sr,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  // bagliore rosa in basso
  var gg = ctx.createRadialGradient(W/2,H*1.15,10,W/2,H*1.15,H*0.75);
  gg.addColorStop(0,'rgba(255,63,146,0.35)'); gg.addColorStop(1,'rgba(255,63,146,0)');
  ctx.fillStyle=gg; ctx.fillRect(0,0,W,H);
}
function chip(txt,x,y){
  ctx.font='700 13px -apple-system,Segoe UI,Roboto,sans-serif';
  var w = ctx.measureText(txt).width + 26;
  ctx.fillStyle='rgba(255,79,154,0.18)'; rr(x-w/2,y-15,w,28,14); ctx.fill();
  ctx.strokeStyle='rgba(255,79,154,0.7)'; ctx.lineWidth=1.5; rr(x-w/2,y-15,w,28,14); ctx.stroke();
  ctx.fillStyle='#ff9ecb'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(txt,x,y);
}
function drawIntro(t){
  bg(t);
  var cx = W/2;
  chip(CFG.brand, cx, H*0.145);
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#fff'; ctx.font='800 '+Math.round(Math.min(44, W*0.104))+'px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText('BLINK RUSH', cx, H*0.232);
  ctx.fillStyle='#c9bfff'; ctx.font='500 15px -apple-system,Segoe UI,Roboto,sans-serif';
  wrapText(CFG.tagline, cx, H*0.272, W*0.82, 21);

  // demo illustrativa: telefono che prende un occhiolino
  var bob = Math.sin(t*0.003)*10;
  drawWink(cx, H*0.385+bob, 30, t*0.004);
  var sx=player.x, sy=player.y, sw=player.w, sh=player.h;
  player.x = cx; player.y = H*0.515; player.w=96; player.h=60;
  drawPlayer();
  player.x=sx; player.y=sy; player.w=sw; player.h=sh;

  ctx.fillStyle='#a89adf'; ctx.font='500 14px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillText('Trascina per raccogliere gli occhiolini  \u2022  evita i \u2717', cx, H*0.605);

  // selettore velocità
  speedBtns = [];
  if (CFG.allowSpeedPick !== false){
    var labels = [['lenta','Lenta'],['normale','Normale'],['veloce','Veloce']];
    var bw2 = Math.min(W*0.265, 100), bh2 = 40, gap2 = 8;
    var totW = bw2*3 + gap2*2, bx2 = cx - totW/2, by2 = H*0.648;
    ctx.fillStyle='rgba(200,190,255,0.7)'; ctx.font='700 11px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.textBaseline='alphabetic'; ctx.textAlign='center';
    ctx.fillText('VELOCIT\u00c0', cx, by2-9);
    for (var i=0;i<3;i++){
      var px2 = bx2 + i*(bw2+gap2);
      var on = (pickedSpeed === labels[i][0]);
      ctx.fillStyle = on ? 'rgba(255,79,154,0.92)' : 'rgba(255,255,255,0.075)';
      rr(px2,by2,bw2,bh2,20); ctx.fill();
      ctx.strokeStyle = on ? '#ff9ecb' : 'rgba(255,255,255,0.18)';
      ctx.lineWidth = on?2:1.5; rr(px2,by2,bw2,bh2,20); ctx.stroke();
      ctx.fillStyle = on ? '#fff' : '#c9bfff';
      ctx.font='700 13px -apple-system,Segoe UI,Roboto,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(labels[i][1], px2+bw2/2, by2+bh2/2+1);
      speedBtns.push({x:px2, y:by2, w:bw2, h:bh2, k:labels[i][0]});
    }
  }

  // pulsante
  var bw = Math.min(W*0.72, 320), bh = 58, bx = cx-bw/2, by = H*0.735;
  var pulse = 1 + Math.sin(t*0.006)*0.03;
  ctx.save(); ctx.translate(cx,by+bh/2); ctx.scale(pulse,pulse); ctx.translate(-cx,-(by+bh/2));
  var g = ctx.createLinearGradient(bx,by,bx+bw,by+bh);
  g.addColorStop(0,'#ff3f92'); g.addColorStop(1,'#ff8a3d');
  ctx.fillStyle=g; rr(bx,by,bw,bh,29); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='800 20px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('TOCCA PER GIOCARE', cx, by+bh/2+1);
  ctx.restore();

  ctx.fillStyle='rgba(200,190,255,0.55)'; ctx.font='500 12px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillText('Il primo gioco pubblicitario fatto a Cuneo', cx, H*0.925);
}
function wrapText(txt,x,y,maxW,lh){
  var words = txt.split(' '), line = '', yy = y;
  for (var i=0;i<words.length;i++){
    var test = line + words[i] + ' ';
    if (ctx.measureText(test).width > maxW && line){
      ctx.fillText(line.trim(), x, yy); line = words[i] + ' '; yy += lh;
    } else line = test;
  }
  ctx.fillText(line.trim(), x, yy);
}
function drawHUD(){
  /* barra tempo PRIMA degli altri elementi: occupa la fascia libera tra i due riquadri */
  var bx = 140, bw = W - 140 - 116, by = 22;
  if (bw > 40){
    ctx.fillStyle='rgba(0,0,0,0.35)'; rr(bx,by,bw,10,5); ctx.fill();
    var frac = clamp(timeLeft/CFG.roundSeconds,0,1);
    ctx.fillStyle = frac>0.3 ? '#5ce1a5' : '#ff7a3d';
    rr(bx,by,bw*frac,10,5); ctx.fill();
  }
  // score
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(0,0,0,0.35)'; rr(10,10,120,40,12); ctx.fill();
  ctx.fillStyle='#ffd34d'; ctx.font='800 20px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText(String(score), 24, 31);
  ctx.fillStyle='#c9bfff'; ctx.font='600 11px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText('PUNTI', 68, 32);
  // vite (cuori)
  for (var i=0;i<CFG.lives;i++){
    var hx = W-26-i*30, hy = 30;
    ctx.fillStyle = i<lives ? '#ff4f9a' : 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.arc(hx-6,hy-3,7,0,7); ctx.arc(hx+6,hy-3,7,0,7);
    ctx.moveTo(hx-13,hy); ctx.arc(hx,hy+9,12,Math.PI,0,true);
    ctx.fill();
  }
}
function drawHint(t){
  if (t - started < 4200 && lastInput < started){
    var hx = player.x + Math.sin(t*0.005)*60;
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(hx, player.y+58, 16, 0, 7); ctx.fill();
    ctx.fillStyle='#140b34'; ctx.font='700 14px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('👆', hx, player.y+59);
    ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.font='700 13px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText('TRASCINA', W/2, player.y+95);
  }
}
function drawEnd(t){
  bg(t);
  var cx = W/2;
  var pw = Math.min(W*0.88, 400), ph = Math.min(560, H*0.74);
  var px = cx-pw/2, py = (H-ph)/2;
  ctx.fillStyle='rgba(10,6,30,0.88)'; rr(px,py,pw,ph,24); ctx.fill();
  ctx.strokeStyle='rgba(255,79,154,0.6)'; ctx.lineWidth=2; rr(px,py,pw,ph,24); ctx.stroke();

  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#ff9ecb'; ctx.font='800 15px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText(endReason==='time' ? 'TEMPO SCADUTO!' : 'OCCHIOLINI ESAURITI!', cx, py+42);

  ctx.fillStyle='#fff'; ctx.font='800 62px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText(String(score), cx, py+112);
  ctx.fillStyle='#c9bfff'; ctx.font='600 13px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText('PUNTI  \u00b7  RECORD ' + bestScore, cx, py+138);

  var stars = score>=180?3:(score>=90?2:1);
  ctx.font='28px -apple-system,Segoe UI,sans-serif';
  var stx = cx - 36;
  for (var i=0;i<3;i++){
    ctx.fillStyle = i<stars ? '#ffd34d' : 'rgba(255,255,255,0.18)';
    ctx.fillText('\u2605', stx + i*36, py+180);
  }

  ctx.fillStyle='#e9e4ff'; ctx.font='500 15px -apple-system,Segoe UI,Roboto,sans-serif';
  wrapText(CFG.endMessage, cx, py+218, pw*0.82, 21);

  ctx.fillStyle='#a89adf'; ctx.font='600 12px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText(CFG.brand + ' \u00b7 ' + CFG.tagline, cx, py+ph-146);

  // RIGIOCA
  var rbw = Math.min(pw*0.52, 176), rbh = 44, rbx = cx-rbw/2, rby = py+ph-132;
  ctx.fillStyle='rgba(255,255,255,0.09)'; rr(rbx,rby,rbw,rbh,22); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.26)'; ctx.lineWidth=1.5; rr(rbx,rby,rbw,rbh,22); ctx.stroke();
  ctx.fillStyle='#e9e4ff'; ctx.font='700 14px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('\u21bb  RIGIOCA', cx, rby+rbh/2+1);
  replayBox = {x:rbx, y:rby, w:rbw, h:rbh};

  // CTA
  var bw = pw*0.84, bh = 58, bx = cx-bw/2, by = py+ph-78;
  var pulse = 1 + Math.sin(t*0.006)*0.03;
  ctx.save(); ctx.translate(cx,by+bh/2); ctx.scale(pulse,pulse); ctx.translate(-cx,-(by+bh/2));
  var g = ctx.createLinearGradient(bx,by,bx+bw,by+bh);
  g.addColorStop(0,'#ff3f92'); g.addColorStop(1,'#ff8a3d');
  ctx.fillStyle=g; rr(bx,by,bw,bh,29); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='800 18px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(CFG.ctaLabel, cx, by+bh/2+1);
  ctx.restore();
  ctaBox = {x:bx, y:by, w:bw, h:bh};
}

/* ---------------- contratto di collaudo (usato da tools/check.mjs) ---------------- */
window.__PLAYABLE__ = function(){
  return { state:STATE, score:score, lives:lives, shake:shake,
           best:bestScore, speed:pickedSpeed, items:items.length };
};

/* ---------------- loop principale ---------------- */
function frame(t){
  var dt = lastT ? Math.min(0.05, (t-lastT)/1000) : 0.016;
  lastT = t;
  try {
    update(dt);
    if (shake>0) shake = Math.max(0, shake - dt*40);
    if (flashT>0) flashT = Math.max(0, flashT - dt);
    ctx.save();
    if (shake>0) ctx.translate(rand(-shake,shake), rand(-shake,shake));
    if (STATE==='INTRO') drawIntro(t);
    else if (STATE==='PLAY'){
      bg(t);
      for (var i=0;i<items.length;i++){
        var it = items[i];
        if (it.type==='wink') drawWink(it.x,it.y,it.r,it.ph);
        else if (it.type==='star') drawStar(it.x,it.y,it.r,it.ph);
        else drawBad(it.x,it.y,it.r,it.ph);
      }
      drawPlayer();
      for (var p=0;p<parts.length;p++){
        var q = parts[p];
        ctx.globalAlpha = clamp(q.a,0,1); ctx.fillStyle=q.c;
        ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,7); ctx.fill();
      }
      ctx.globalAlpha=1;
      for (var f=0;f<floaters.length;f++){
        var fl = floaters[f];
        ctx.globalAlpha = clamp(fl.a,0,1); ctx.fillStyle=fl.c;
        ctx.font='800 17px -apple-system,Segoe UI,Roboto,sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(fl.t, fl.x, fl.y);
      }
      ctx.globalAlpha=1;
      drawHUD(); drawHint(t);
      if (flashT>0){ ctx.fillStyle='rgba(255,60,60,'+(flashT*1.6)+')'; ctx.fillRect(0,0,W,H); }
    }
    else drawEnd(t);
    ctx.restore();
  } catch(err){
    // fail-safe: mai schermo bianco
    ctx.fillStyle='#0b0722'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff'; ctx.font='16px sans-serif'; ctx.textAlign='center';
    ctx.fillText('…', W/2, H/2);
    if (window.console) console.error(err);
  }
  var bk = document.getElementById('back');
  if (bk) bk.style.display = (STATE === 'INTRO' || STATE === 'END') ? 'block' : 'none';
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
})();
</script>
